<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover：內容延伸到瀏海／圓角區，全螢幕時邊緣才不會留一圈
     ⛔ initial-scale 刻意保持 1 —— 「手機顯示 80%」已經改由下面的 --app-scale（CSS transform）負責。
        原因見下方那段註解：initial-scale 一進全螢幕就會被 Chrome 作廢。
     ⚠ 只有行動裝置會讀 viewport meta，桌機瀏覽器一律忽略。 -->
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>德芳連鎖藥局 內部查詢系統</title>

<!-- ========== PWA：讓「加到主畫面」變成獨立視窗 App，而不是開瀏覽器的捷徑 ==========
     ⚠ 差別全在這幾行。少了它們，「加到主畫面」只是一個書籤捷徑 ——
        點下去照樣用瀏覽器開，網址列、工具列一條都不會少。
     ・iOS 只認 apple-mobile-web-app-capable，完全不吃 manifest 的 display
     ・Android 只認 manifest 的 display / orientation
     兩邊都要寫，才會兩邊都全螢幕。
     ⚠ 改了這些之後，舊的主畫面圖示不會自動升級 —— 必須先刪掉、重新加一次。 -->
<link rel="manifest" href="manifest.json?v=20260830-boutique">
<meta name="theme-color" content="#F6F9F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="德芳查詢">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" as="image" href="logo-brand.png">
<script>
  /* iPhone 必須在第一個 iframe 建立前就走一般排版。若等到 body 後方才掛 class，
     WebKit 會先用 absolute + transform 建立跨網域合成座標；後來即使 computed style
     已變成 static，內頁的 fixed 舞台仍可能沿用第一次的偏移與裁切。
     只提前 iPhone class；iPad 的 ef6a4ea 合成建立順序完全不動。 */
  if (/iPhone|iPod/.test(navigator.userAgent)) {
    document.documentElement.classList.add('iphone-device');
  }
</script>

<style>
  @font-face{
    font-family:"LINE Seed TW";
    src:url("fonts/LINESeedTW-Regular-v1.400.woff2") format("woff2");
    font-style:normal;font-weight:400;font-display:swap
  }
  /* 系統與 iframe 交接期間只露出柔白薄荷底，不加遮罩、假進度或等待動畫。 */
  html,body{margin:0;height:100%;
    background-color:#F6F9F6;
    background-image:linear-gradient(155deg,#FAFCFA 0%,#F4F8F4 58%,#EDF4EE 100%);
    overflow:hidden;touch-action:pan-x pan-y}
  /* dvh 才抓得到「當下真正看得到的高度」——手機網址列收放時視窗高度是會變的 */
  @supports (height:100dvh){ html,body{height:100dvh} }
  /* 精品啟動舞台：由外殼暫時疊在 iframe 上方，交棒後整個移除；不是 fixed，也不修改 iframe 合成狀態。 */
  #bootStage{
    position:absolute;z-index:2;inset:0;display:grid;place-items:center;
    overflow:visible;box-sizing:border-box;padding:24px;
    font-family:"LINE Seed TW","Microsoft JhengHei","PingFang TC",sans-serif;
    visibility:visible;transition:visibility 0s linear 1s
  }
  .boot-backdrop{
    position:absolute;z-index:0;top:0;left:0;width:100%;
    height:calc(100% + var(--app-bottom-inset) + var(--app-overscan-guard));overflow:hidden;
    background-color:#F6F9F6;
    background-image:linear-gradient(155deg,#FAFCFA 0%,#F4F8F4 58%,#EDF4EE 100%);
    opacity:1;transition:opacity .5s cubic-bezier(.4,0,.2,1) .5s
  }
  .boot-backdrop::before,.boot-backdrop::after{
    content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(58px)
  }
  .boot-backdrop::before{width:min(430px,54vw);height:min(430px,54vw);top:-24%;right:-9%;background:rgba(177,219,185,.19)}
  .boot-backdrop::after{width:min(360px,46vw);height:min(360px,46vw);bottom:-28%;left:-7%;background:rgba(213,232,215,.26)}
  .boot-lockup{position:relative;z-index:1;display:grid;justify-items:center;transform:translateY(-1.6vh);
    opacity:1;transition:opacity .5s cubic-bezier(.4,0,.2,1)}
  /* ⛔ 這個 opacity:0 是防線，不是佔位，拿掉會直接重現「半截 LOGO」。
     logo-brand.png 是非交錯 PNG（由上往下逐列解碼），瀏覽器在位元組還沒收完時
     就會把已有的掃描線畫出來。2026-09-23 可控重現：後半段位元組不送，畫面就是
     半顆紅心＋被削掉的字，而且此時 class 已經是 boot-brand-ready、opacity 已是 1。
     所以 Logo 的任何可見度一律綁 html.boot-logo-ready（＝img.decode() 真的完成）。 */
  .boot-logo{display:block;width:min(340px,48vw);max-height:112px;height:auto;aspect-ratio:827/105;object-fit:contain;
    opacity:0}
  /* 等 GAS 的那幾秒：畫面上只有薄荷底，Logo／中線／系統名一律不出現。
     ⛔ 2026-09-23 使用者指示移除原本的「淡影呼吸」，不要再加回來：
        它救不了半截 LOGO（淡影畫的是同一張沒收完的圖），又把啟動拆成
        「淡影」與「三拍」兩段。等待期什麼都不給，才符合這頁一開始就寫的
        「不加遮罩、假進度或等待動畫」。 */
  /* 等待期的讀取條（2026-09-23 使用者指示加回：網路慢時純薄荷底會像當機）。
     只在「還沒開跑三拍」時出現；三拍一開跑就淡出，Logo 動畫照舊從零開始。
     進度＝三個真實關卡（品牌圖／iframe load／GAS 分流）＋關卡之間緩慢爬升，永遠停在 95% 前。 */
  .boot-progress{position:absolute;z-index:1;left:50%;top:50%;width:min(180px,44vw);height:3px;margin-left:calc(min(180px,44vw)/-2);
    border-radius:3px;background:rgba(43,126,67,.12);opacity:0;
    animation:boot-progress-in .4s ease .25s forwards;transition:opacity .35s ease}
  .boot-progress i{display:block;height:100%;width:100%;border-radius:inherit;background:#83CF8F;
    transform-origin:left;transform:scaleX(.04);transition:transform .45s cubic-bezier(.22,.78,.28,1)}
  .boot-progress-text{position:absolute;left:0;right:0;top:12px;text-align:center;color:#4F7A5B;font-size:12px;letter-spacing:.2em;white-space:nowrap}
  @keyframes boot-progress-in{to{opacity:1}}
  html.boot-brand-ready .boot-progress{animation:none;opacity:0}
  .boot-rule{width:46px;height:1px;margin:24px 0 17px;opacity:0;transform-origin:center;
    background:linear-gradient(90deg,transparent,rgba(43,126,67,.42),transparent)}
  .boot-name{color:#1E4229;font-size:clamp(13px,1.45vw,16px);font-weight:500;letter-spacing:.42em;text-indent:.42em;opacity:0}
  /* 精品三拍：Logo → 中線微光 → 系統名稱舒展。 */
  html.boot-brand-ready.boot-logo-ready .boot-logo{animation:boot-logo-arrive 1.36s cubic-bezier(.22,.78,.28,1) backwards;opacity:1}
  html.boot-brand-ready .boot-rule{animation:boot-rule-glow .82s cubic-bezier(.22,.78,.28,1) 1.23s both}
  html.boot-brand-ready .boot-name{animation:boot-name-settle 1.06s cubic-bezier(.2,.72,.2,1) 1.94s both}
  /* 淡影呼吸移除後，起點就是「完全沒有」；translateY(9px) 留著，飄升那一下才有東西可飄。 */
  @keyframes boot-logo-arrive{
    from{opacity:0;transform:translateY(9px)}
    to{opacity:1;transform:none}
  }
  @keyframes boot-rule-glow{
    from{opacity:0;transform:scaleX(.08);filter:drop-shadow(0 0 0 rgba(43,126,67,0))}
    70%{opacity:1;transform:scaleX(1.12);filter:drop-shadow(0 0 5px rgba(43,126,67,.22))}
    to{opacity:1;transform:scaleX(1);filter:drop-shadow(0 0 0 rgba(43,126,67,0))}
  }
  @keyframes boot-name-settle{
    from{opacity:0;letter-spacing:.24em;text-indent:.24em;transform:translateY(6px)}
    to{opacity:1;letter-spacing:.42em;text-indent:.42em;transform:translateY(0)}
  }

  iframe{
    display:block;position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:#F6F9F6
  }
  /* iPad／桌機不建立額外盒子，iframe 仍維持 ef6a4ea 的直接合成基準。 */
  #appFrameViewport{display:contents}
  html.app-ready #bootStage{visibility:hidden}
  /* 先讓 Logo／中線／文字淡完，再由獨立薄荷背景於後半秒淡出。 */
  html.app-ready .boot-lockup{opacity:0}
  html.app-ready .boot-backdrop{opacity:0}
  html:not(.app-ready) #iphoneFullscreenBtn{display:none!important}
  @media (prefers-reduced-motion:reduce){
    html.boot-brand-ready.boot-logo-ready .boot-logo,
    html.boot-brand-ready .boot-rule,
    html.boot-brand-ready .boot-name{animation:none;opacity:1;transform:none}
    .boot-lockup{transition:none}
    #bootStage{transition:visibility 0s linear .5s}
    .boot-backdrop{transition:opacity .5s linear}
  }

  /* ========== 手機顯示 80%（2026-08-03 改用 CSS，不再用 initial-scale）==========
     ⛔ 為什麼不能用 <meta viewport initial-scale=0.8>：
        **Chrome 一進 Fullscreen API 就把 page scale 強制重設成 1**，那行 meta 當場作廢。
        使用者的症狀就是這個 —— 登入頁還是 80%，一按下去（碰畫面→我們補全螢幕）就跳回 100%。
        可控實驗（headless + mobile 模擬，螢幕 914dp）：
          全螢幕前 innerWidth 1142 (scale .8) → 進全螢幕 914 (scale 1) → 退出又回 1142。
          外層殼頁請求、或 GAS iframe 內請求，兩種都一樣會被重設。
        而我們為了吃回挖孔那 41px（見下面那段）**一定得進全螢幕** → 兩件事天生互斥，只能換做法。

     ✅ 改成對 iframe 做 CSS transform：版面先放大 1/0.8 再 scale(.8) 縮回來。
        iframe 內的 layout viewport ＝ 914/0.8 ＝ 1142 CSS px，與 initial-scale=0.8 效果相同，
        但它是 CSS，page scale 怎麼被重設都影響不到。

     ⚠ 這跟「同一份文件裡用 CSS zoom」是兩回事，不會弄壞 index.html 的假旋轉座標換算 ——
       iframe 內部 innerWidth 與 clientX 同時都是 1142 那個座標系，內部完全無感。
     ⚠ 只在 pointer:coarse 套用：桌機本來就忽略 viewport meta＝電腦版行為維持不變。
     要調整比例只改 --app-scale 這一個數字。 */
  :root{ --app-scale:.8; --app-bottom-inset:0px; --app-overscan-guard:0px }
  /* iOS 主畫面 App／Fullscreen API 會保留底部 home indicator 區。
     跨網域 GAS iframe 必須往這一區 overscan，再由殼頁的 overflow:hidden 裁掉超出部分；
     若反過來縮短 iframe，只會把白邊換成殼頁底色，內容與影片仍然用不到該區。
     安全區必須在最外層殼頁處理：iframe 內的 env(safe-area-inset-*) 永遠讀不到。
     一般 iOS 優先採系統回報值；主畫面／全螢幕時保留 20px fallback，避免 WebKit 回報 0。 */
  html.ios-device{
    --app-bottom-inset:env(safe-area-inset-bottom,0px)
  }
  /* iPad 的合成縫需要 16px guard；iPhone 則恢復修 iPad 前已穩定的 4px 取整保險。
     兩者必須分流，不能再把 iPad 的 16px 套到 iPhone。 */
  html.ios-device:not(.iphone-device){
    --app-overscan-guard:16px
  }
  html.ios-device.iphone-device{
    --app-overscan-guard:4px
  }
  html.ios-device.ios-standalone,
  html.ios-device:fullscreen,
  html.ios-device:-webkit-full-screen{
    --app-bottom-inset:max(env(safe-area-inset-bottom,0px),20px)
  }
  @media (pointer: coarse){
    /* iframe 版面比視窗大，不讓殼頁自己長出捲軸 */
    html,body{ overflow:hidden }
    iframe{
      width:calc(100% / var(--app-scale));
      height:calc((100% + var(--app-bottom-inset) + var(--app-overscan-guard)) / var(--app-scale));
      transform:scale(var(--app-scale));
      transform-origin:0 0;
    }
    /* iPhone WebKit 會把直接 transform 的跨網域 iframe 與內頁 fixed 舞台合成到錯的原點，
       因此側欄、主畫面、講義會一起右偏，底部也一起被裁。把完全相同的 80% 縮放移到
       外層普通容器，iframe 本身只負責 100% 鋪滿，不再直接 transform。
       iPad 不套這兩條，仍由上方原始 iframe 規則直接縮放，避免破壞實機通過的底線基準。 */
    html.iphone-device #appFrameViewport{
      display:block;
      width:calc(100% / var(--app-scale));
      height:calc((100% + var(--app-bottom-inset) + var(--app-overscan-guard)) / var(--app-scale));
      transform:scale(var(--app-scale));
      transform-origin:0 0;
    }
    html.iphone-device iframe{
      position:static;top:auto;left:auto;width:100%;height:100%;transform:none
    }
    /* iPhone 的 YouTube 像素會進入 iOS 原生媒體合成層。播放期間把最後一層外殼 scale
       一併拿掉，以 1:1 layout 維持完全相同的實體尺寸，避免左側 Dynamic Island 安全區
       在 transformed browsing context 內被平台影片層重複套用。只由 GAS 影片生命週期切換；
       iPad 不會有 iphone-device，因此 ef6a4ea 的 iframe 合成基準完全不受影響。 */
    html.iphone-device.iphone-video-native{--app-scale:1}
    html.iphone-device.iphone-video-native #appFrameViewport{
      width:100%;
      height:calc(100% + var(--app-bottom-inset) + var(--app-overscan-guard));
      transform:none
    }
  }
  #iphoneFullscreenBtn{display:none;position:fixed;right:max(env(safe-area-inset-right,0px),12px);
    bottom:max(env(safe-area-inset-bottom,0px),12px);z-index:2147483647;height:40px;padding:0 14px;
    align-items:center;justify-content:center;gap:7px;border:1px solid rgba(255,255,255,.95);border-radius:20px;
    color:#fff;background:rgba(43,126,67,.92);box-shadow:0 5px 16px rgba(30,66,41,.32);
    font:700 14px/1 "Microsoft JhengHei",sans-serif;letter-spacing:1px;-webkit-tap-highlight-color:transparent}
  /* iPhone 實機會把這顆 outer fixed 鈕的垂直基準誤認成 overscan frame 底（比可見 viewport 多 24px）。
     把同一組 bottom fallback＋guard 加回定位，讓按鈕仍落在可見 viewport 的安全區內。
     只修外殼控制鈕；iframe 幾何與 iPad ef6a4ea 合成路徑完全不動。 */
  html.iphone-device #iphoneFullscreenBtn{
    bottom:calc(max(env(safe-area-inset-bottom,0px),12px) + var(--app-bottom-inset) + var(--app-overscan-guard))
  }
  html.iphone-device.ios-standalone.fs-supported:not(.fs-active) #iphoneFullscreenBtn{display:flex}
  /* 一般裝置仍由內層按鈕的 postMessage 順勢進全螢幕，不增加過場。
     只有支援 Fullscreen API 的 iPhone 主畫面 App 顯示一次性按鈕：iOS 不保證跨 iframe
     的 postMessage 保留 user activation，直接手勢是收掉原生狀態列／home indicator 的可靠入口。 */
  /* ⛔ 這裡原本有 #versionBadge —— 常駐在右上角的 v1.0.0 圓標，已於 2026-08-05 移除。
     使用者要求「不要佔用到整個程式」：那顆標籤是 fixed 且 z-index 2147483646，
     永遠壓在系統畫面最上層。版本資訊改成點進去才看 ——
     位置在系統側邊欄「登出」上方的「ℹ️ 軟體資訊」（實作在 GAS 的 index.html，APP_INFO）。
     ⚠ 要改版本號請改那裡，不要在這一層加回常駐標籤。 */
</style>
</head>
<body>
  <main id="bootStage" role="status" aria-label="德芳連鎖藥局內部查詢系統啟動中">
    <div class="boot-backdrop" aria-hidden="true"></div>
    <div class="boot-progress" aria-hidden="true"><i></i><div class="boot-progress-text">載入中…</div></div>
    <div class="boot-lockup">
      <img class="boot-logo" src="logo-brand.png" width="827" height="105" decoding="async" alt="德芳連鎖藥局">
      <div class="boot-rule" aria-hidden="true"></div>
      <div class="boot-name">內部查詢系統</div>
    </div>
  </main>
  <!-- ⚠ 權限是「逐層委派」的：外層沒給，內層那個 googleusercontent 沙盒 iframe 就拿不到。
         geolocation 當初就是漏了它而讓 GPS 簽到必定失敗。vibrate 是為了自製鍵盤的按鍵震動先補上
         （目前 Chrome 未必把它列為 permission policy，是不認就忽略的保險，加了無害）。
         一律用 * 不用預設的 'src'：GAS 會再轉一層到 googleusercontent（不同 origin），
         'src' 只放行 script.google.com 會在第二道門被卡掉。 -->
  <!-- ⚠⚠ 這裡指的是**員工正式部署**（AKfycbyvILy…），2026-08-06 從測試部署切過來。
       員工拿到的網址就是這個殼頁，所以**改了這一行就等於改了所有人看到的版本**。
       · 要讓員工拿到新功能：跑 `發布更新.bat`（＝把雲端 HEAD 拍成新的正式版照片）
       · 開發中要自己先試：跑 `更新測試台.bat`，開測試部署的 /exec 網址看，不會影響員工
       ⛔ 別再把這行改回測試部署 —— 那樣一來我每次重拍測試台，員工就會立刻吃到未驗證的版本。 -->
  <div id="appFrameViewport">
    <iframe
      src="https://script.google.com/macros/s/AKfycbyvILyQU2BWYuzaCp0lo135aXTyRZOX3NzFjVvSyLLxtCXtmCQun4XPsGhEcvbcEgxN/exec?shell=20260809-safearea2"
      allow="autoplay *; encrypted-media *; fullscreen *; geolocation *; vibrate *"
      allowfullscreen></iframe>
  </div>
  <button type="button" id="iphoneFullscreenBtn" aria-label="隱藏 iPhone 系統列，進入完整畫面">⛶ 完整畫面</button>

<script>
/* viewport-ready 只負責安全區通道。啟動的視覺順序是「先等內容，再一次把品牌動畫跑完」：
     ① 等待期：只有薄荷底，Logo／中線／系統名一律不出現（2026-09-23 拿掉原本的淡影呼吸）
     ② logo 解碼完 ＋ iframe 完整 load ＋ GAS 回報分流完成 → 這時候才開跑三拍動畫
     ③ 三拍整段跑完 → 立刻交棒進 APP
   ⛔ 不可把三拍動畫綁回固定延遲（舊版綁版面穩定後 650ms）：那會讓動畫在 GAS 還沒回來時就跑完，
      Logo 接著靜止杵在畫面上等交棒，使用者看到的就是「分兩段載入」。
   兩道保險都不能拆：8 秒還等不到 GAS 就照樣開跑（至少讓品牌完整播完，再進去看真正的錯誤頁），
   13 秒則無論如何硬交棒，不能永遠卡在品牌頁。 */
var BRAND_SEQUENCE_MS = 3000;
var appRevealScheduled = false;
var appRevealFallback = null;
var brandStartFallback = null;
var appFrameLoaded = false;
var appRouteSettled = false;
var bootSequenceTimer = null;
var bootSequenceStarted = false;
var bootMotionReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var bootLogoSettled = false;

/* 三拍動畫只跑一次，跑完直接交棒；開跑之後不再回頭看任何條件，才不會被中途打斷。 */
function beginBrandSequence() {
  if (bootSequenceStarted) return;
  if (document.documentElement.classList.contains('app-ready')) return;
  if (!document.getElementById('bootStage')) return;
  bootSequenceStarted = true;
  tickBootProgress();
  clearTimeout(brandStartFallback);
  document.documentElement.classList.add('boot-brand-ready');
  clearTimeout(bootSequenceTimer);

      /* iPhone 26.x 的實作對 options 支援仍不一致；不傳 options 是最可靠的標準呼叫。
         Android／iPad 保留 navigationUI:'hide' 的既有行為。 */
      var r = 是iPhone裝置 ? 請求全螢幕.call(el) : 請求全螢幕.call(el, { navigationUI: 'hide' });
      if (r && r['catch']) r['catch'](function () {});
    } catch (e) {}
  }

  function 同步全螢幕狀態() {
    document.documentElement.classList.toggle('fs-active',
      !!(document.fullscreenElement || document.webkitFullscreenElement));
  }
  document.addEventListener('fullscreenchange', 同步全螢幕狀態);
  document.addEventListener('webkitfullscreenchange', 同步全螢幕狀態);
  同步全螢幕狀態();

  var iphoneFullscreenBtn = document.getElementById('iphoneFullscreenBtn');
  if (iphoneFullscreenBtn) {
    iphoneFullscreenBtn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      go();
    });
  }

  /* ===== 全螢幕由「系統內的按鈕」觸發（2026-08-05）=====
     使用者：「點一下進入全螢幕這個按鈕很煩，讓同意、登入等各式按鈕點了都會進入全螢幕」。
     殼頁收不到跨網域 iframe 的任何事件，所以由內層（GAS 的 index.html）在按鈕的 pointerdown
     時 window.top.postMessage 過來，我們順勢請求全螢幕。使用者的手勢會沿 frame 樹傳給祖先，
     所以這裡雖然隔了兩層 iframe，requestFullscreen 仍然算「在使用者手勢當中」。

     ⚠⚠ 絕對不可以改回「輪詢 navigator.userActivation 見到互動就進全螢幕」⚠⚠
     那會把 YouTube 播放要用的那一次手勢搶走 —— 2026-08-04 影片永遠停在 0:00、
     查了整整一天的事故根因就是它。一次點擊的 transient user activation 只有一份。
     現在安全的原因是**內層刻意不送影片區的點擊**（.video-container 與表格裡的 ▶ 播放鈕），
     播放與全螢幕不再競爭同一次點擊。要放寬那份排除清單之前，先回去讀那則事故紀錄。 */
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.defang !== 'fullscreen') return;
    if (String(e.origin).indexOf('.google') < 0) return;   // 只信任 GAS 那兩層（script.google.com / googleusercontent.com）
    go();
  });
})();
</script>
