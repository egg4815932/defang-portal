<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover：內容延伸到瀏海／圓角區，全螢幕時邊緣才不會留一圈
     ⛔ initial-scale 刻意保持 1 —— 「手機顯示 80%」已經改由下面的 --app-scale（CSS transform）負責。
        原因見下方那段註解：initial-scale 一進全螢幕就會被 Chrome 作廢。
     ⚠ 只有行動裝置會讀 viewport meta，桌機瀏覽器一律忽略。 -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>德芳連鎖藥局 內部查詢系統</title>

<!-- ========== PWA：讓「加到主畫面」變成獨立視窗 App，而不是開瀏覽器的捷徑 ==========
     ⚠ 差別全在這幾行。少了它們，「加到主畫面」只是一個書籤捷徑 ——
        點下去照樣用瀏覽器開，網址列、工具列一條都不會少。
     ・iOS 只認 apple-mobile-web-app-capable，完全不吃 manifest 的 display
     ・Android 只認 manifest 的 display / orientation
     兩邊都要寫，才會兩邊都全螢幕。
     ⚠ 改了這些之後，舊的主畫面圖示不會自動升級 —— 必須先刪掉、重新加一次。 -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B7E43">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="德芳查詢">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">

<style>
  /* 底色從白色改成品牌漸層：全螢幕時 iframe 以外露出的部分才不會是刺眼的白（深色模式下是黑） */
  html,body{margin:0;height:100%;
    background:linear-gradient(165deg,#F0FAF2 0%,#DFF2E3 55%,#CDEBD5 100%)}
  /* dvh 才抓得到「當下真正看得到的高度」——手機網址列收放時視窗高度是會變的 */
  @supports (height:100dvh){ html,body{height:100dvh} }
  iframe{display:block;width:100%;height:100%;border:0}

  /* ========== 手機顯示 80%（2026-08-03 改用 CSS，不再用 initial-scale）==========
     ⛔ 為什麼不能用 <meta viewport initial-scale=0.8>：
        **Chrome 一進 Fullscreen API 就把 page scale 強制重設成 1**，那行 meta 當場作廢。
        使用者的症狀就是這個 —— 登入頁還是 80%，一按下去（碰畫面→我們補全螢幕）就跳回 100%。
        可控實驗（headless + mobile 模擬，螢幕 914dp）：
          全螢幕前 innerWidth 1142 (scale .8) → 進全螢幕 914 (scale 1) → 退出又回 1142。
          外層殼頁請求、或 GAS iframe 內請求，兩種都一樣會被重設。
        而我們為了吃回挖孔那 41px（見下面那段）**一定得進全螢幕** → 兩件事天生互斥，只能換做法。

     ✅ 改成對 iframe 做 CSS transform：版面先放大 1/0.8 再 scale(.8) 縮回來。
        iframe 內的 layout viewport ＝ 914/0.8 ＝ 1142 CSS px，與 initial-scale=0.8 效果相同，
        但它是 CSS，page scale 怎麼被重設都影響不到。

     ⚠ 這跟「同一份文件裡用 CSS zoom」是兩回事，不會弄壞 index.html 的假旋轉座標換算 ——
       iframe 內部 innerWidth 與 clientX 同時都是 1142 那個座標系，內部完全無感。
     ⚠ 只在 pointer:coarse 套用：桌機本來就忽略 viewport meta＝電腦版行為維持不變。
     要調整比例只改 --app-scale 這一個數字。 */
  :root{ --app-scale:.8 }
  @media (pointer: coarse){
    /* iframe 版面比視窗大，不讓殼頁自己長出捲軸 */
    html,body{ overflow:hidden }
    iframe{
      width:calc(100% / var(--app-scale));
      height:calc(100% / var(--app-scale));
      transform:scale(var(--app-scale));
      transform-origin:0 0;
    }
  }
  .fallback{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
    font-family:"Microsoft JhengHei",sans-serif;color:#0aa25a;font-size:18px;z-index:-1}
  /* 自動進全螢幕失敗時才亮出來的備援鈕（順利的話使用者永遠看不到它） */
  #fsFallback{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:2147483647;
    display:none;padding:10px 20px;border:0;border-radius:999px;
    background:rgba(43,126,67,.94);color:#fff;font:14px/1.2 "Microsoft JhengHei",sans-serif;
    box-shadow:0 2px 12px rgba(0,0,0,.28)}
</style>
</head>
<body>
  <div class="fallback">德芳連鎖藥局 內部查詢系統載入中…</div>
  <iframe
    src="https://script.google.com/macros/s/AKfycbw2PGNABsP3BGqeoQEqBVdxcz1dkneTw9q-WthtUvXvJ0bjkrOiiRyOPPLuTyr-QBoK/exec"
    <!-- ⚠ 權限是「逐層委派」的：外層沒給，內層那個 googleusercontent 沙盒 iframe 就拿不到。
         geolocation 當初就是漏了它而讓 GPS 簽到必定失敗。vibrate 是為了自製鍵盤的按鍵震動先補上
         （目前 Chrome 未必把它列為 permission policy，是不認就忽略的保險，加了無害）。
         一律用 * 不用預設的 'src'：GAS 會再轉一層到 googleusercontent（不同 origin），
         'src' 只放行 script.google.com 會在第二道門被卡掉。 -->
    allow="autoplay; encrypted-media; fullscreen; geolocation *; vibrate *"
    allowfullscreen></iframe>
  <button id="fsFallback" type="button">點一下用滿整個螢幕</button>

<script>
/* ===== 吃到螢幕最側邊那條「挖孔區」（2026-08-03 真機實測定案）=====
   症狀：Android 手機橫放時，前鏡頭那一側永遠有一條用不到的黑（實測 41 CSS px）。

   根因：Chrome 把「內容能不能延伸進挖孔」綁死在 Fullscreen API 上。
   WebAPK 就算 manifest 寫了 display:fullscreen，只要沒進 Fullscreen API，
   Chrome 就自己把 viewport 縮到挖孔內側 —— 真機量到 screen 915 / inner 874，
   而 safe-area-inset 全部回報 0（＝Chrome 根本沒把這頁當 viewport-fit=cover）。
   那 41px 不是我們沒畫，是壓根沒分配給我們，在 CSS 層怎麼補都沒用
   （2026-08-02 在 doGet 與 index.html 補 viewport-fit / env() 全部無效，就是這個原因：
     那兩層都在 iframe 內，iframe 裡的 env(safe-area-inset-*) 恆為 0）。
   進了 Fullscreen API 之後：inner 914、safe-area-left 40，整條拿回來。

   代價：Chrome 會跳一次「從頂端向下拖曳可退出全螢幕」的系統提示。
   ⚠ 那個提示關不掉，別再花時間找方法 —— 它是刻意的安全防護（網頁若能無聲佔滿整個
     螢幕就能偽裝成系統畫面），Chromium 上要求隱藏它的票都掛 Security 標籤。
     navigationUI:'hide' 管的是導覽列，不是這個提示。使用者已知並接受。

   ⚠ iPhone 不支援非 video 元素的 Fullscreen API，但它也不需要 ——
     iOS 主畫面 App 靠 viewport-fit=cover + black-translucent 原生就會鋪到瀏海底下。
     下面那個「寬度落差」判斷會讓 iPhone／iPad／桌機／無挖孔機種全部自動跳過這一段。 */
(function () {
  var el = document.documentElement;
  if (!el.requestFullscreen) return;                  // iPhone 從這裡離開

  /* 視窗寬度沒被切掉就不必進全螢幕，免得白白跳一個提示。
     ⚠ initial-scale 現在固定是 1（80% 改由 CSS 的 --app-scale 負責），SCALE 讀出來就是 1，
       innerWidth 本身已經是 dp、可以直接比。這段換算留著是防呆：萬一日後有人又把
       initial-scale 改成非 1，innerWidth 會被放大成 CSS px，而 screen.width 一律是 dp ——
       兩者直接相減會變負數 → 這裡就 return，整段全螢幕（＝挖孔那 41px）默默失效。
       它自己會讀上面那行 meta，不必手動同步。
     ⚠ 桌機瀏覽器根本不讀 viewport meta，innerWidth 沒有被放大過，硬乘 0.8 會讓「視窗沒最大化」
       被誤判成「視窗被切掉」而跑去請求全螢幕。所以只有行動裝置才套 SCALE，桌機維持原樣。 */
  var vp = document.querySelector('meta[name=viewport]');
  var m = vp && /initial-scale\s*=\s*([\d.]+)/.exec(vp.content);
  var 行動裝置 = matchMedia('(pointer: coarse)').matches;
  var SCALE = (行動裝置 && m) ? parseFloat(m[1]) : 1;
  if (Math.round(screen.width - window.innerWidth * SCALE) <= 1) return;

  var btn = document.getElementById('fsFallback');
  var timer = null, 起點 = 0;

  function go() {
    return el.requestFullscreen({ navigationUI: 'hide' })['catch'](function () {});
  }
  function stop() { if (timer) { clearInterval(timer); timer = null; } }
  /* ⚠ 間隔要短（200ms 不是 500ms）：GAS 那層的 index.html 在「按下登入的當下」也會呼叫
     一次 openFullscreen()，它若搶在我們前面，全螢幕元素會變成整個 GAS iframe（top layer），
     上面 --app-scale 的 transform 當場失效＝畫面跳回 100%。
     我們先進全螢幕的話，index.html 的 已是App全螢幕() 守門會讀到 (display-mode: fullscreen)
     ＝true 而自己 return（跨兩層 iframe 也讀得到，2026-08-03 用三層跨域探針實測過）。
     門檻改用「經過的毫秒」而不是次數，日後再調間隔也不必重算。 */
  function start() { stop(); 起點 = Date.now(); timer = setInterval(tick, 200); }

  function tick() {
    var 已過 = Date.now() - 起點;
    if (document.fullscreenElement) { stop(); btn.style.display = 'none'; return; }

    /* 使用者碰到的是 GAS 那個跨網域 iframe，殼頁收不到任何事件；
       但 user activation 會沿著 frame 樹往上傳給祖先，所以這裡讀得到「剛剛有人碰過畫面」，
       可以順勢補上全螢幕請求 —— 不必多做一個「點一下開始」的過場。 */
    var ua = navigator.userActivation;
    if (ua && ua.isActive) go();

    // 自動這條路走不通時（人明明碰過卻始終進不去）才亮備援鈕，順利的話不會出現
    if (已過 > 8000 && (!ua || ua.hasBeenActive)) btn.style.display = 'block';
    if (已過 > 300000) stop();                        // 5 分鐘後收工，不要無限輪詢耗電
  }

  btn.addEventListener('click', function () { go(); });
  document.addEventListener('fullscreenchange', function () {
    if (document.fullscreenElement) { stop(); btn.style.display = 'none'; }
    else start();          // 使用者自己滑掉全螢幕的話，下次碰畫面時再補回來
  });
  start();
})();
</script>
</body>
</html>
