<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover：內容延伸到瀏海／圓角區，全螢幕時邊緣才不會留一圈
     ⛔ initial-scale 刻意保持 1 —— 「手機顯示 80%」已經改由下面的 --app-scale（CSS transform）負責。
        原因見下方那段註解：initial-scale 一進全螢幕就會被 Chrome 作廢。
     ⚠ 只有行動裝置會讀 viewport meta，桌機瀏覽器一律忽略。 -->
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>德芳連鎖藥局 內部查詢系統</title>

<!-- ========== PWA：讓「加到主畫面」變成獨立視窗 App，而不是開瀏覽器的捷徑 ==========
     ⚠ 差別全在這幾行。少了它們，「加到主畫面」只是一個書籤捷徑 ——
        點下去照樣用瀏覽器開，網址列、工具列一條都不會少。
     ・iOS 只認 apple-mobile-web-app-capable，完全不吃 manifest 的 display
     ・Android 只認 manifest 的 display / orientation
     兩邊都要寫，才會兩邊都全螢幕。
     ⚠ 改了這些之後，舊的主畫面圖示不會自動升級 —— 必須先刪掉、重新加一次。 -->
<link rel="manifest" href="manifest.json?v=20260830-boutique">
<meta name="theme-color" content="#F6F9F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="德芳查詢">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" as="image" href="logo-brand.png">

<style>
  @font-face{
    font-family:"LINE Seed TW";
    src:url("fonts/LINESeedTW-Regular-v1.400.woff2") format("woff2");
    font-style:normal;font-weight:400;font-display:swap
  }
  /* 系統與 iframe 交接期間只露出柔白薄荷底，不加遮罩、假進度或等待動畫。 */
  html,body{margin:0;height:100%;
    background-color:#F6F9F6;
    background-image:linear-gradient(155deg,#FAFCFA 0%,#F4F8F4 58%,#EDF4EE 100%);
    overflow:hidden;touch-action:pan-x pan-y}
  /* dvh 才抓得到「當下真正看得到的高度」——手機網址列收放時視窗高度是會變的 */
  @supports (height:100dvh){ html,body{height:100dvh} }
  /* 精品啟動舞台：由外殼暫時疊在 iframe 上方，交棒後整個移除；不是 fixed，也不修改 iframe 合成狀態。 */
  #bootStage{
    position:absolute;z-index:2;inset:0;display:grid;place-items:center;
    overflow:hidden;box-sizing:border-box;padding:24px;
    font-family:"LINE Seed TW","Microsoft JhengHei","PingFang TC",sans-serif;
    opacity:1;visibility:visible;
    transition:opacity .28s ease,visibility 0s linear .28s
  }
  #bootStage::before,#bootStage::after{
    content:"";position:absolute;border-radius:50%;pointer-events:none;filter:blur(58px)
  }
  #bootStage::before{width:min(430px,54vw);height:min(430px,54vw);top:-24%;right:-9%;background:rgba(177,219,185,.19)}
  #bootStage::after{width:min(360px,46vw);height:min(360px,46vw);bottom:-28%;left:-7%;background:rgba(213,232,215,.26)}
  .boot-lockup{position:relative;display:grid;justify-items:center;
    opacity:0;transform:translateY(calc(-1.6vh + 9px))}
  html.boot-brand-ready .boot-lockup{animation:boot-arrive .58s cubic-bezier(.22,.78,.28,1) both}
  .boot-logo{display:block;width:min(340px,48vw);max-height:112px;height:auto;aspect-ratio:827/105;object-fit:contain;
    filter:drop-shadow(0 10px 22px rgba(30,66,41,.08))}
  .boot-rule{width:46px;height:1px;margin:24px 0 17px;background:linear-gradient(90deg,transparent,rgba(43,126,67,.42),transparent)}
  .boot-name{color:#1E4229;font-size:clamp(13px,1.45vw,16px);font-weight:500;letter-spacing:.42em;text-indent:.42em}
  @keyframes boot-arrive{
    from{opacity:0;transform:translateY(calc(-1.6vh + 9px))}
    to{opacity:1;transform:translateY(-1.6vh)}
  }

  iframe{
    display:block;position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:#F6F9F6
  }
  html.app-ready #bootStage{opacity:0;visibility:hidden}
  html:not(.app-ready) #iphoneFullscreenBtn{display:none!important}
  @media (prefers-reduced-motion:reduce){
    html.boot-brand-ready .boot-lockup{animation:none;opacity:1;transform:translateY(-1.6vh)}
    #bootStage{transition:none}
  }

  /* ========== 手機顯示 80%（2026-08-03 改用 CSS，不再用 initial-scale）==========
     ⛔ 為什麼不能用 <meta viewport initial-scale=0.8>：
        **Chrome 一進 Fullscreen API 就把 page scale 強制重設成 1**，那行 meta 當場作廢。
        使用者的症狀就是這個 —— 登入頁還是 80%，一按下去（碰畫面→我們補全螢幕）就跳回 100%。
        可控實驗（headless + mobile 模擬，螢幕 914dp）：
          全螢幕前 innerWidth 1142 (scale .8) → 進全螢幕 914 (scale 1) → 退出又回 1142。
          外層殼頁請求、或 GAS iframe 內請求，兩種都一樣會被重設。
        而我們為了吃回挖孔那 41px（見下面那段）**一定得進全螢幕** → 兩件事天生互斥，只能換做法。

     ✅ 改成對 iframe 做 CSS transform：版面先放大 1/0.8 再 scale(.8) 縮回來。
        iframe 內的 layout viewport ＝ 914/0.8 ＝ 1142 CSS px，與 initial-scale=0.8 效果相同，
        但它是 CSS，page scale 怎麼被重設都影響不到。

     ⚠ 這跟「同一份文件裡用 CSS zoom」是兩回事，不會弄壞 index.html 的假旋轉座標換算 ——
       iframe 內部 innerWidth 與 clientX 同時都是 1142 那個座標系，內部完全無感。
     ⚠ 只在 pointer:coarse 套用：桌機本來就忽略 viewport meta＝電腦版行為維持不變。
     要調整比例只改 --app-scale 這一個數字。 */
  :root{ --app-scale:.8; --app-bottom-inset:0px; --app-overscan-guard:0px }
  /* iOS 主畫面 App／Fullscreen API 會保留底部 home indicator 區。
     跨網域 GAS iframe 必須往這一區 overscan，再由殼頁的 overflow:hidden 裁掉超出部分；
     若反過來縮短 iframe，只會把白邊換成殼頁底色，內容與影片仍然用不到該區。
     安全區必須在最外層殼頁處理：iframe 內的 env(safe-area-inset-*) 永遠讀不到。
     一般 iOS 優先採系統回報值；主畫面／全螢幕時保留 20px fallback，避免 WebKit 回報 0。 */
  html.ios-device{
    --app-bottom-inset:env(safe-area-inset-bottom,0px);
    /* iPad WebKit 在 transform:scale(.8) 的 iframe 邊緣會留下數個實體像素的合成縫。
       這 16px 只把畫面延伸到螢幕外，不算進內頁的內容安全距離。 */
    --app-overscan-guard:16px
  }
  html.ios-device.ios-standalone,
  html.ios-device:fullscreen,
  html.ios-device:-webkit-full-screen{
    --app-bottom-inset:max(env(safe-area-inset-bottom,0px),20px)
  }
  @media (pointer: coarse){
    /* iframe 版面比視窗大，不讓殼頁自己長出捲軸 */
    html,body{ overflow:hidden }
    iframe{
      width:calc(100% / var(--app-scale));
      height:calc((100% + var(--app-bottom-inset) + var(--app-overscan-guard)) / var(--app-scale));
      transform:scale(var(--app-scale));
      transform-origin:0 0;
    }
  }
  #iphoneFullscreenBtn{display:none;position:fixed;right:max(env(safe-area-inset-right,0px),12px);
    bottom:max(env(safe-area-inset-bottom,0px),12px);z-index:2147483647;height:40px;padding:0 14px;
    align-items:center;justify-content:center;gap:7px;border:1px solid rgba(255,255,255,.95);border-radius:20px;
    color:#fff;background:rgba(43,126,67,.92);box-shadow:0 5px 16px rgba(30,66,41,.32);
    font:700 14px/1 "Microsoft JhengHei",sans-serif;letter-spacing:1px;-webkit-tap-highlight-color:transparent}
  html.iphone-device.ios-standalone.fs-supported:not(.fs-active) #iphoneFullscreenBtn{display:flex}
  /* 一般裝置仍由內層按鈕的 postMessage 順勢進全螢幕，不增加過場。
     只有支援 Fullscreen API 的 iPhone 主畫面 App 顯示一次性按鈕：iOS 不保證跨 iframe
     的 postMessage 保留 user activation，直接手勢是收掉原生狀態列／home indicator 的可靠入口。 */
  /* ⛔ 這裡原本有 #versionBadge —— 常駐在右上角的 v1.0.0 圓標，已於 2026-08-05 移除。
     使用者要求「不要佔用到整個程式」：那顆標籤是 fixed 且 z-index 2147483646，
     永遠壓在系統畫面最上層。版本資訊改成點進去才看 ——
     位置在系統側邊欄「登出」上方的「ℹ️ 軟體資訊」（實作在 GAS 的 index.html，APP_INFO）。
     ⚠ 要改版本號請改那裡，不要在這一層加回常駐標籤。 */
</style>
</head>
<body>
  <main id="bootStage" role="status" aria-label="德芳連鎖藥局內部查詢系統啟動中">
    <div class="boot-lockup">
      <img class="boot-logo" src="logo-brand.png" width="827" height="105" decoding="async" alt="德芳連鎖藥局">
      <div class="boot-rule" aria-hidden="true"></div>
      <div class="boot-name">內部查詢系統</div>
    </div>
  </main>
  <!-- ⚠ 權限是「逐層委派」的：外層沒給，內層那個 googleusercontent 沙盒 iframe 就拿不到。
         geolocation 當初就是漏了它而讓 GPS 簽到必定失敗。vibrate 是為了自製鍵盤的按鍵震動先補上
         （目前 Chrome 未必把它列為 permission policy，是不認就忽略的保險，加了無害）。
         一律用 * 不用預設的 'src'：GAS 會再轉一層到 googleusercontent（不同 origin），
         'src' 只放行 script.google.com 會在第二道門被卡掉。 -->
  <!-- ⚠⚠ 這裡指的是**員工正式部署**（AKfycbyvILy…），2026-08-06 從測試部署切過來。
       員工拿到的網址就是這個殼頁，所以**改了這一行就等於改了所有人看到的版本**。
       · 要讓員工拿到新功能：跑 `發布更新.bat`（＝把雲端 HEAD 拍成新的正式版照片）
       · 開發中要自己先試：跑 `更新測試台.bat`，開測試部署的 /exec 網址看，不會影響員工
       ⛔ 別再把這行改回測試部署 —— 那樣一來我每次重拍測試台，員工就會立刻吃到未驗證的版本。 -->
  <iframe
    src="https://script.google.com/macros/s/AKfycbyvILyQU2BWYuzaCp0lo135aXTyRZOX3NzFjVvSyLLxtCXtmCQun4XPsGhEcvbcEgxN/exec?shell=20260809-safearea2"
    allow="autoplay *; encrypted-media *; fullscreen *; geolocation *; vibrate *"
    allowfullscreen></iframe>
  <button type="button" id="iphoneFullscreenBtn" aria-label="隱藏 iPhone 系統列，進入完整畫面">⛶ 完整畫面</button>

<script>
/* GAS 內頁送出既有 viewport-ready 握手後才交棒；沒有新增登入 gate 或假進度。
   8 秒只是錯誤頁保險：即使握手失敗，也要讓真正錯誤露出來，不能永遠卡在品牌頁。 */
var appRevealScheduled = false;
var appRevealFallback = null;
var bootBrandTimer = null;
var bootBrandEarliest = Date.now() + 650;
function scheduleBootBrandAfterViewportSettles() {
  clearTimeout(bootBrandTimer);
  if (document.documentElement.classList.contains('app-ready')) return;
  bootBrandTimer = setTimeout(function () {
    if (document.documentElement.classList.contains('app-ready')) return;
    if (!document.getElementById('bootStage')) return;
    document.documentElement.classList.add('boot-brand-ready');
  }, Math.max(180,bootBrandEarliest - Date.now()));
}
scheduleBootBrandAfterViewportSettles();
window.addEventListener('resize',scheduleBootBrandAfterViewportSettles);
window.addEventListener('orientationchange',scheduleBootBrandAfterViewportSettles);
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize',scheduleBootBrandAfterViewportSettles);
}
function revealApp() {
  if (appRevealScheduled || document.documentElement.classList.contains('app-ready')) return;
  appRevealScheduled = true;
  clearTimeout(appRevealFallback);
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      document.documentElement.classList.add('app-ready');
      var stage = document.getElementById('bootStage');
      if (stage) {
        stage.setAttribute('aria-hidden','true');
        setTimeout(function () { stage.remove(); }, 360);
      }
    });
  });
}
window.addEventListener('message',function(e){
  if (!e.data || e.data.defang !== 'viewport-ready') return;
  if (String(e.origin).indexOf('.google') < 0) return;
  revealApp();
});
appRevealFallback = setTimeout(revealApp,8000);

/* PWA 殼頁禁止瀏覽器原生 pinch zoom。內層 GAS 另有相同防線；雙層都擋才能避免
   跨網域 iframe 縮放時連續觸發 outer/inner visual viewport 重排，把手機 WebView 撐垮。 */
(function 禁止頁面原生縮放() {
  function 擋縮放(e) { if (e.cancelable) e.preventDefault(); }
  function 擋多指(e) { if (e.touches && e.touches.length > 1) 擋縮放(e); }
  document.addEventListener('touchstart', 擋多指, { passive: false, capture: true });
  document.addEventListener('touchmove', 擋多指, { passive: false, capture: true });
  document.addEventListener('gesturestart', 擋縮放, { passive: false, capture: true });
  document.addEventListener('gesturechange', 擋縮放, { passive: false, capture: true });
  document.addEventListener('gestureend', 擋縮放, { passive: false, capture: true });
  document.addEventListener('wheel', function (e) { if (e.ctrlKey) 擋縮放(e); }, { passive: false });
})();

/* iOS 安全區只能由這個最外層殼頁處理；iPadOS 13+ 常偽裝成 Mac。 */
var 是iOS裝置 = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
                (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
var 是iPhone裝置 = /iPhone|iPod/.test(navigator.userAgent);
var 是獨立App = navigator.standalone === true ||
                matchMedia('(display-mode: standalone)').matches ||
                matchMedia('(display-mode: fullscreen)').matches;
if (是iOS裝置) {
  document.documentElement.classList.add('ios-device');
  if (是獨立App) document.documentElement.classList.add('ios-standalone');
}
if (是iPhone裝置) {
  document.documentElement.classList.add('iphone-device');
}

/* 外殼在 iOS 安全區外 overscan，並把真正被裁掉的內頁尺寸回傳給 GAS。 */
var appViewportTarget = null;
var appViewportOrigin = '';
var appViewportSyncTimer = null;
var LOGIN_SESSION_KEY = 'defang.login.session.v1';
function clampViewportInset(value) {
  value = Number(value);
  return Math.min(96, Math.max(0, isFinite(value) ? value : 0));
}
function sendViewportInsets() {
  if (!appViewportTarget) return;
  var frame = document.querySelector('iframe');
  if (!frame) return;
  var rect = frame.getBoundingClientRect();
  var scale = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--app-scale')) || 1;
  var viewportWidth = window.innerWidth;
  var viewportHeight = window.innerHeight;
  var landscape = viewportWidth > viewportHeight;
  var right = clampViewportInset((rect.right - viewportWidth) / scale);
  var overscanGuard = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--app-overscan-guard')) || 0;
  /* guard 只用來蓋掉 iframe 合成縫；不可回報給內頁，否則按鈕會被多推高一截。 */
  var bottom = clampViewportInset((rect.bottom - viewportHeight - overscanGuard) / scale);
  /* iPhone 直式只顯示轉向提醒，不使用外殼裁切；清掉上一個橫式留下的 inset，
     避免連續旋轉的中間尺寸把內頁寬高扣到只剩背景。 */
  if (是iPhone裝置 && !landscape) right = bottom = 0;
  try {
    appViewportTarget.postMessage({
      defang: 'viewport-insets',
      right: right,
      bottom: bottom,
      landscape: landscape,
      viewportWidth: viewportWidth,
      viewportHeight: viewportHeight
    }, appViewportOrigin);
  } catch (e) {}
}
function scheduleViewportInsets(delay) {
  clearTimeout(appViewportSyncTimer);
  appViewportSyncTimer = setTimeout(sendViewportInsets, typeof delay === 'number' ? delay : 240);
}
window.addEventListener('message', function (e) {
  if (!e.data || e.data.defang !== 'viewport-ready') return;
  if (String(e.origin).indexOf('.google') < 0) return;
  appViewportTarget = e.source;
  appViewportOrigin = e.origin;
  scheduleViewportInsets(0);
});

/* GAS 內容位在 Google 的跨網域 sandbox iframe；手機鎖屏時 WebView 可能只重建內層 iframe。
   登入票證因此同步存一份在固定來源的 GitHub PWA 外殼，內層重建後再取回。
   只接受已用 viewport-ready 握手過的同一個 GAS 視窗，避免其他 frame 寫入登入資料。 */
window.addEventListener('message', function (e) {
  if (!e.data || String(e.data.defang).indexOf('login-session-') !== 0) return;
  if (e.source !== appViewportTarget || e.origin !== appViewportOrigin) return;
  try {
    if (e.data.defang === 'login-session-save') {
      var record = e.data.record;
      if (record && record.id && record.token) {
        localStorage.setItem(LOGIN_SESSION_KEY, JSON.stringify(record));
      }
      return;
    }
    if (e.data.defang === 'login-session-clear') {
      localStorage.removeItem(LOGIN_SESSION_KEY);
      return;
    }
    if (e.data.defang === 'login-session-request') {
      var saved = null;
      try { saved = JSON.parse(localStorage.getItem(LOGIN_SESSION_KEY) || 'null'); } catch (ignore) {}
      e.source.postMessage({ defang: 'login-session-value', record: saved }, e.origin);
    }
  } catch (ignore) {}
});
window.addEventListener('resize', scheduleViewportInsets);
window.addEventListener('orientationchange', function () { scheduleViewportInsets(360); });
window.addEventListener('pageshow', function () { scheduleViewportInsets(0); });
if (window.visualViewport) visualViewport.addEventListener('resize', scheduleViewportInsets);

/* ===== 安裝到主畫面（2026-08-05）=====
   系統同意頁右邊那顆「安裝」鈕按下去時，內層會 postMessage 過來，我們試著跳出原生安裝視窗。

   ⚠ Chrome 要發 beforeinstallprompt，網站必須符合安裝條件，其中一項是**要有 service worker**
     → 2026-08-05 為此補了 sw.js（使用者要求 Android 做成一鍵）。
     那支 SW **一個位元組都不快取**，只做 pass-through，所以不會有「改了程式卻看不到」的問題。
     ⛔ 要在 sw.js 裡加快取之前，先讀它開頭那段警告。
   ⚠ iPhone 永遠走教學那條路：iOS 沒有任何程式化安裝的 API，只能由使用者自己
     「分享 → 加入主畫面」。這是 Apple 的限制，任何網站都一樣。 */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js?v=20260809-safearea2').catch(function () {});   // 版本參數迫使已安裝 App 檢查新殼
  });
}

var deferredPrompt = null;
window.addEventListener('beforeinstallprompt', function (e) {
  e.preventDefault();          // 擋掉 Chrome 自己那條迷你提示列，改由我們的按鈕決定時機
  deferredPrompt = e;
});
window.addEventListener('appinstalled', function () { deferredPrompt = null; });
window.addEventListener('message', function (e) {
  if (!e.data || e.data.defang !== 'install') return;
  if (String(e.origin).indexOf('.google') < 0) return;
  if (!deferredPrompt) return;                       // 沒有可用的安裝提示 → 內層那張說明卡自己會顯示
  deferredPrompt.prompt();
  deferredPrompt = null;                             // 一個 prompt 只能用一次
});

/* ===== 吃到螢幕最側邊那條「挖孔區」（2026-08-03 真機實測定案）=====
   症狀：Android 手機橫放時，前鏡頭那一側永遠有一條用不到的黑（實測 41 CSS px）。

   根因：Chrome 把「內容能不能延伸進挖孔」綁死在 Fullscreen API 上。
   WebAPK 就算 manifest 寫了 display:fullscreen，只要沒進 Fullscreen API，
   Chrome 就自己把 viewport 縮到挖孔內側 —— 真機量到 screen 915 / inner 874，
   而 safe-area-inset 全部回報 0（＝Chrome 根本沒把這頁當 viewport-fit=cover）。
   那 41px 不是我們沒畫，是壓根沒分配給我們，在 CSS 層怎麼補都沒用
   （2026-08-02 在 doGet 與 index.html 補 viewport-fit / env() 全部無效，就是這個原因：
     那兩層都在 iframe 內，iframe 裡的 env(safe-area-inset-*) 恆為 0）。
   進了 Fullscreen API 之後：inner 914、safe-area-left 40，整條拿回來。

   代價：Chrome 會跳一次「從頂端向下拖曳可退出全螢幕」的系統提示。
   ⚠ 那個提示關不掉，別再花時間找方法 —— 它是刻意的安全防護（網頁若能無聲佔滿整個
     螢幕就能偽裝成系統畫面），Chromium 上要求隱藏它的票都掛 Security 標籤。
     navigationUI:'hide' 管的是導覽列，不是這個提示。使用者已知並接受。

   iPhone 舊版 WebKit 不支援非 video 元素的 Fullscreen API；新版若提供 requestFullscreen，
   會在使用者按系統按鈕或下方「完整畫面」時進入，真正收掉狀態列與 home indicator。 */
(function () {
  var el = document.documentElement;
  /* Safari 舊版可能只有 webkit 前綴；不支援的 iPhone 會安全離開，維持一般主畫面 App。 */
  var 請求全螢幕 = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!請求全螢幕) return;
  if (是iPhone裝置) document.documentElement.classList.add('fs-supported');

  /* 視窗寬度沒被切掉就不必進全螢幕，免得白白跳一個提示。
     ⚠ initial-scale 現在固定是 1（80% 改由 CSS 的 --app-scale 負責），SCALE 讀出來就是 1，
       innerWidth 本身已經是 dp、可以直接比。這段換算留著是防呆：萬一日後有人又把
       initial-scale 改成非 1，innerWidth 會被放大成 CSS px，而 screen.width 一律是 dp ——
       兩者直接相減會變負數 → 這裡就 return，整段全螢幕（＝挖孔那 41px）默默失效。
       它自己會讀上面那行 meta，不必手動同步。
     ⚠ 桌機瀏覽器根本不讀 viewport meta，innerWidth 沒有被放大過，硬乘 0.8 會讓「視窗沒最大化」
       被誤判成「視窗被切掉」而跑去請求全螢幕。所以只有行動裝置才套 SCALE，桌機維持原樣。 */
  var vp = document.querySelector('meta[name=viewport]');
  var m = vp && /initial-scale\s*=\s*([\d.]+)/.exec(vp.content);
  var 行動裝置 = matchMedia('(pointer: coarse)').matches;
  var SCALE = (行動裝置 && m) ? parseFloat(m[1]) : 1;
  /* ⚠ 2026-08-06 補的例外 —— iPad 原本永遠卡在這一行。
       這道守門是為了「Android 挖孔」寫的：沒有被切掉的視窗就不必進全螢幕，免得白跳一個提示。
       但 iPad 沒有挖孔，screen.width - innerWidth 算出來是 0（或負數）→ 直接 return
       ＝**整段全螢幕從來沒有在 iPad 上執行過**。

       而 iPad 進全螢幕是有東西可以拿的：iOS 主畫面 App 一律會畫一條系統狀態列
       （時間／日期／電量／Wi-Fi），黏在畫面最上緣壓著我們的 UI。
       那條列**沒有任何網頁 API 可以關掉**（原生 App 才有 prefersStatusBarHidden），
       唯一的可能就是 Fullscreen API —— iPad Safari 支援非 video 元素的全螢幕（iPhone 不支援）。

       所以：iOS 主畫面 App 一律放行，不看寬度落差。
       ⚠ 只認 navigator.standalone（iOS／iPadOS 官方 API，最可靠）——
         別改用 display-mode: fullscreen，我們的 manifest 本身就是 fullscreen，分不出來
         （2026-08-05 安裝鈕在 iPad 上消失就是踩這個坑）。
       ⚠ Android／桌機的 navigator.standalone 是 undefined ＝行為完全不變。
       支援 requestFullscreen 的新版 iPhone 也會由這條放行。 */
  var iOS主畫面App = navigator.standalone === true;
  if (!iOS主畫面App && Math.round(screen.width - window.innerWidth * SCALE) <= 1) return;

  function go() {
    if (document.fullscreenElement || document.webkitFullscreenElement) return;   // 已經在全螢幕，重複請求只會在 console 報錯
    /* ⚠ webkit 前綴版不回傳 Promise，直接串 .catch 會 TypeError → 要先確認回傳值有 catch */
    try {
      /* iPhone 26.x 的實作對 options 支援仍不一致；不傳 options 是最可靠的標準呼叫。
         Android／iPad 保留 navigationUI:'hide' 的既有行為。 */
      var r = 是iPhone裝置 ? 請求全螢幕.call(el) : 請求全螢幕.call(el, { navigationUI: 'hide' });
      if (r && r['catch']) r['catch'](function () {});
    } catch (e) {}
  }

  function 同步全螢幕狀態() {
    document.documentElement.classList.toggle('fs-active',
      !!(document.fullscreenElement || document.webkitFullscreenElement));
  }
  document.addEventListener('fullscreenchange', 同步全螢幕狀態);
  document.addEventListener('webkitfullscreenchange', 同步全螢幕狀態);
  同步全螢幕狀態();

  var iphoneFullscreenBtn = document.getElementById('iphoneFullscreenBtn');
  if (iphoneFullscreenBtn) {
    iphoneFullscreenBtn.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      go();
    });
  }

  /* ===== 全螢幕由「系統內的按鈕」觸發（2026-08-05）=====
     使用者：「點一下進入全螢幕這個按鈕很煩，讓同意、登入等各式按鈕點了都會進入全螢幕」。
     殼頁收不到跨網域 iframe 的任何事件，所以由內層（GAS 的 index.html）在按鈕的 pointerdown
     時 window.top.postMessage 過來，我們順勢請求全螢幕。使用者的手勢會沿 frame 樹傳給祖先，
     所以這裡雖然隔了兩層 iframe，requestFullscreen 仍然算「在使用者手勢當中」。

     ⚠⚠ 絕對不可以改回「輪詢 navigator.userActivation 見到互動就進全螢幕」⚠⚠
     那會把 YouTube 播放要用的那一次手勢搶走 —— 2026-08-04 影片永遠停在 0:00、
     查了整整一天的事故根因就是它。一次點擊的 transient user activation 只有一份。
     現在安全的原因是**內層刻意不送影片區的點擊**（.video-container 與表格裡的 ▶ 播放鈕），
     播放與全螢幕不再競爭同一次點擊。要放寬那份排除清單之前，先回去讀那則事故紀錄。 */
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.defang !== 'fullscreen') return;
    if (String(e.origin).indexOf('.google') < 0) return;   // 只信任 GAS 那兩層（script.google.com / googleusercontent.com）
    go();
  });
})();
</script>
</body>
</html>
