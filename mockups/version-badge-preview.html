<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>右上角版本標籤預覽</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:"Microsoft JhengHei",sans-serif}
  body{background:linear-gradient(165deg,#f0faf2,#cdebd5);color:#23442c}
  .screen{position:relative;min-height:100vh;padding:72px 24px 24px}
  .version{position:fixed;top:max(10px,env(safe-area-inset-top));
    right:max(10px,env(safe-area-inset-right));padding:5px 9px;
    border:1px solid rgba(255,255,255,.55);border-radius:999px;
    background:rgba(30,76,43,.72);color:#fff;font:600 11px/1 "Microsoft JhengHei",sans-serif;
    letter-spacing:.04em;box-shadow:0 2px 8px rgba(0,0,0,.2);backdrop-filter:blur(4px)}
  .card{max-width:420px;margin:auto;padding:28px;border-radius:24px;background:#fff;
    box-shadow:0 12px 40px rgba(36,92,52,.16)}
  h1{margin:0 0 12px;font-size:24px}.hint{margin:0;color:#64806c;line-height:1.7}
</style>
</head>
<body>
  <main class="screen">
    <div class="version">v1.0.0</div>
    <section class="card">
      <h1>版本標籤預覽</h1>
      <p class="hint">正式頁面會固定顯示在右上角，且不會攔截影片或其他按鈕的點擊。</p>
    </section>
  </main>
</body>
</html>
